name: 插件验证与打包

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: 核对安装资源与源码一致
        run: git diff --exit-code -- index.js assets
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: fawntavern-frontend-renderer
          path: dist/*
          if-no-files-found: error
